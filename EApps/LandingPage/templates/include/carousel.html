{% load static %}
<div id="myCarousel" class="carousel slide" data-ride="carousel">
  <ol class="carousel-indicators">
  {% for carousel in carousels %}
    <li data-target="#myCarousel" data-slide-to="{{forloop.counter0}}" class="{% if forloop.first %}active{% endif %}"></li>
  {% endfor %} 
  </ol>
  <div class="carousel-inner">
  {% for carousel in carousels %}
    <div class="carousel-item {% if forloop.first %}active{% endif %}">
      <img src="{{carousel.image.url}}" alt="image" id="caro-img">
      <div class="carousel-caption slide">
            <h3 class="py-5 car-title">{{carousel.title}}</h3>
            <p>Thank you, Chicago - A night we won't forget.</p>
      </div>  
    </div>
    {% endfor %}
    
  </div>
  <a class="carousel-control-prev" id="caro-icon" href="#myCarousel" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true" style="height:35px;width:35px"></span>
    <span class="sr-only">Previous</span>
  </a>
  <a class="carousel-control-next" id="caro-icon" href="#myCarousel" role="button" data-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true" style="height:35px;width:35px"></span>
    <span class="sr-only">Next</span>
  </a>
</div>
<link rel="stylesheet" href="{% static 'css/carousel.css' %}" type="text/css">
<style>
.carousel-indicators li {
  width: 0.5rem;
  height: 0.5rem;
  border-radius: 100%;
  align-self: center;
  transition: all 0.5s ease-in-out;
}
.carousel-indicators li.active {
  width: 1rem;
  height: 1rem;
}


</style>
